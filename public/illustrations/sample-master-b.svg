<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Illustration of a made up master teacher (Sample). Flat storybook style, DESIGN §7 palette. -->
  <rect width="200" height="200" fill="#DFE9D5"/>
  <circle cx="100" cy="92" r="70" fill="#FFC94D" opacity="0.25"/>
  <!-- kurta and shawl -->
  <path d="M30 200 C34 150 62 132 100 132 C138 132 166 150 170 200 Z" fill="#FFFDF8"/>
  <path d="M30 200 C34 152 60 134 84 132 L92 200 Z" fill="#C8553D"/>
  <path d="M170 200 C166 152 140 134 116 132 L108 200 Z" fill="#C8553D"/>
  <path d="M84 132 L92 200 M116 132 L108 200" stroke="#FFC94D" stroke-width="4"/>
  <!-- neck -->
  <path d="M86 114 L86 134 C92 140 108 140 114 134 L114 114 Z" fill="#7E4F35"/>
  <!-- ears and face -->
  <ellipse cx="70" cy="92" rx="6" ry="9" fill="#8D5A3B"/>
  <ellipse cx="130" cy="92" rx="6" ry="9" fill="#8D5A3B"/>
  <ellipse cx="100" cy="88" rx="30" ry="35" fill="#8D5A3B"/>
  <!-- white hair at the sides -->
  <path d="M70 84 C68 64 78 54 86 52 C80 62 76 72 76 86 Z" fill="#F7F3EA"/>
  <path d="M130 84 C132 64 122 54 114 52 C120 62 124 72 124 86 Z" fill="#F7F3EA"/>
  <!-- spectacles -->
  <g fill="none" stroke="#15302A" stroke-width="2.6">
    <rect x="78" y="82" width="18" height="14" rx="5"/>
    <rect x="104" y="82" width="18" height="14" rx="5"/>
    <path d="M96 88 L104 88"/>
  </g>
  <circle cx="87" cy="89" r="2.6" fill="#15302A"/>
  <circle cx="113" cy="89" r="2.6" fill="#15302A"/>
  <!-- moustache and smile -->
  <path d="M86 106 C92 101 98 103 100 106 C102 103 108 101 114 106 C108 109 92 109 86 106 Z" fill="#F7F3EA"/>
  <path d="M93 113 Q100 118 107 113" stroke="#15302A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <ellipse cx="79" cy="104" rx="5" ry="3" fill="#F2A93B" opacity="0.4"/>
  <ellipse cx="121" cy="104" rx="5" ry="3" fill="#F2A93B" opacity="0.4"/>
</svg>
